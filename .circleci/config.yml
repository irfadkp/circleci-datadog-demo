version: 2.1

# Define a simple job
jobs:
  build:
    docker:
      - image: cimg/node:18.0
    steps:
      - checkout
      - run:
          name: Install dependencies
          command: |
            echo "Installing dependencies..."
            npm --version
      - run:
          name: Run tests
          command: |
            echo "Running tests..."
            echo "Tests passed!"
      - run:
          name: Build application
          command: |
            echo "Building application..."
            echo "Build completed!"

  test:
    docker:
      - image: cimg/node:18.0
    steps:
      - checkout
      - run:
          name: Run unit tests
          command: |
            echo "Running unit tests..."
            sleep 2
            echo "Unit tests passed!"

  deploy:
    docker:
      - image: cimg/node:18.0
    steps:
      - checkout
      - run:
          name: Plan deployment
          command: |
            circleci run release plan "${CIRCLE_JOB}" \
              --environment-name="staging" \
              --component-name="${CIRCLE_PROJECT_REPONAME}" \
              --target-version="1.0.${CIRCLE_BUILD_NUM}-${CIRCLE_SHA1:0:7}"
      - run:
          name: Deploy to staging
          command: |
            echo "Deploying to staging environment..."
            sleep 3
            echo "Deployment successful!"
      - run:
          name: Update deployment status to running
          command: circleci run release update "${CIRCLE_JOB}" --status=RUNNING
      - run:
          name: Update deployment status to success
          command: circleci run release update "${CIRCLE_JOB}" --status=SUCCESS
          when: on_success
      - run:
          name: Update deployment status to failed
          command: circleci run release update "${CIRCLE_JOB}" --status=FAILED
          when: on_fail

  # Define the workflow
workflows:
  version: 2
  build-test-deploy:
    jobs:
      - build
      - test:
          requires:
            - build
      - deploy:
          requires:
            - test
          filters:
            branches:
              only: main
